name: Build Toto Rush

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Create Android project
        run: |
          flutter create --org com.ssservice --project-name toto_rush --platforms=android .
          rm -rf test
          sed -i 's/android:label="[^"]*"/android:label="Toto Rush"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: toto-rush-apk
          path: build/app/outputs/flutter-apk/app-release.apk
